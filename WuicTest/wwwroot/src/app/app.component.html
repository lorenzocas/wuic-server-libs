@if (busyVisible) {
<div #busyIndicator class="busy-indicator">
    <i class="pi pi-spin pi-spinner"></i>
</div>
}

<!-- First-run wizard: lazy-loaded da wuic-framework-lib. Si auto-controlla
     visibilita' (probe FirstRunStatus al boot, mostra overlay solo se firstRun=true,
     altrimenti renderizza nulla). L'output (complete) viene emesso quando il
     workflow chiude (sia per firstRun=false al boot, sia post-install success).
     L'overlay copre il resto della shell con z-index 900, quindi i widget
     dell'app sotto possono renderizzare in parallelo senza conflitti visivi. -->
<wuic-first-run-wizard (complete)="onFirstRunComplete()"></wuic-first-run-wizard>

<div class="app-shell">
    <!-- Header shell: layout, stili token-based e theme selector vivono nel
         componente lib <wuic-app-header>. L'host proietta solo i pezzi lazy
         (menu, notification bell) e l'azienda switcher; le install ereditano
         i miglioramenti header aggiornando la lib, senza ri-clonare la shell. -->
    <wuic-app-header class="app-shell-header" [showWidgets]="showRightHeaderBlock">
        <!-- showUserArea=false: l'identita' utente (bandiera/nome/logout) vive
             ora nel <wuic-user-menu> integrato nell'app-header, il menubar
             resta pura navigazione. -->
        <ng-container *ngIf="metaMenuComponent" [ngComponentOutlet]="metaMenuComponent"
            [ngComponentOutletInputs]="metaMenuInputs"></ng-container>
        <!-- Multi-tenant azienda switcher: widget standalone self-contained.
             Visibilita' gestita internamente al widget (early-return per non-
             superadmin / flag off) via `:host([hidden])`. -->
        <wuic-azienda-switcher wuicHeaderExtra></wuic-azienda-switcher>
        <div wuicHeaderNotifications class="app-shell-notification">
            <ng-container *ngIf="notificationBellComponent"
                [ngComponentOutlet]="notificationBellComponent"></ng-container>
        </div>
    </wuic-app-header>
    @if (showRightHeaderBlock) {
    <main id="app-main" class="app-shell-content" role="main">
        <router-outlet />
    </main>
    }
</div>

<!-- Template custom: il `summary`/`detail` puo' contenere markup generato dal
     framework (es. `Eliminato <span style='color:red'>Cities</span> con ID 1`).
     Lo rendiamo via [innerHTML] passando per `toastHtml()` (sanitizer whitelist
     in app.component.ts) invece dell'escape di default di p-toast. -->
<p-toast position="bottom-right" [baseZIndex]="3000">
  <ng-template let-message pTemplate="message">
    <i class="p-toast-message-icon pi" aria-hidden="true"
       [ngClass]="{
         'pi-check': message.severity === 'success',
         'pi-info-circle': message.severity === 'info' || !message.severity,
         'pi-exclamation-triangle': message.severity === 'warn',
         'pi-times-circle': message.severity === 'error'
       }"></i>
    <div class="p-toast-message-text">
      @if (message.summary) {
        <div class="p-toast-summary" [innerHTML]="toastHtml(message.summary)"></div>
      }
      @if (message.detail) {
        <div class="p-toast-detail" [innerHTML]="toastHtml(message.detail)"></div>
      }
    </div>
  </ng-template>
</p-toast>

<!-- Skill crash-reporting Commit 9b (Opzione B): dialog estratto in lib.
     Si auto-sottoscrive a GlobalHandler.messageNotification — niente
     wiring lato consumer, niente template duplicato. -->
<wuic-error-dialog></wuic-error-dialog>

<p-confirmDialog [header]="'conferma'" [closeAriaLabel]="'chiudi'" [acceptAriaLabel]="'conferma'"
    [rejectAriaLabel]="'annulla'" />

<!-- Floating chatbot RAG (visibile solo se licenza pro abilita la feature `rag-chatbot`).
     Posizionamento `position:fixed` interno - sta in basso a destra senza richiedere
     wrapper layout dall'host. -->
<wuic-rag-chatbot-fab></wuic-rag-chatbot-fab>
