<body>
  <app-root></app-root>
  <script>
    // Google Maps JavaScript API loader. La key NON e' hardcoded:
    // viene fetchata da /api/Config/MapsKey al boot, esposta dal backend
    // ASP.NET (KonvergenceCore) leggendo da IConfiguration["GoogleMaps:ApiKey"]:
    //   - dev:  dotnet user-secrets set GoogleMaps:ApiKey AIza...
    //   - prod: env var GoogleMaps__ApiKey o appsettings.Production.json (gitignored)
    // La key e' "public" per design (esposta nel browser); la sicurezza viene
    // dalle HTTP-referrer restrictions impostate in Google Cloud Console.
    (function loadGoogleMaps() {
      var loader = function (apiKey) {
        if (!apiKey) { console.warn('Google Maps API key non configurata (GoogleMaps:ApiKey vuoto)'); return; }
        (g => { var h, a, k, p = "The Google Maps JavaScript API", c = "google", l = "importLibrary", q = "__ib__", m = document, b = window; b = b[c] || (b[c] = {}); var d = b.maps || (b.maps = {}), r = new Set, e = new URLSearchParams, u = () => h || (h = new Promise(async (f, n) => { await (a = m.createElement("script")); e.set("libraries", [...r] + ""); for (k in g) e.set(k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()), g[k]); e.set("callback", c + ".maps." + q); a.src = `https://maps.${c}apis.com/maps/api/js?` + e; d[q] = f; a.onerror = () => h = n(Error(p + " could not load.")); a.nonce = m.querySelector("script[nonce]")?.nonce || ""; m.head.append(a) })); d[l] ? console.warn(p + " only loads once. Ignoring:", g) : d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n)) })({
          v: "weekly",
          key: apiKey
        });
      };
      fetch('/api/Config/MapsKey', { credentials: 'same-origin' })
        .then(r => r.ok ? r.json() : { apiKey: '' })
        .then(cfg => loader(cfg.apiKey))
        .catch(err => console.warn('Failed to fetch Google Maps API key:', err));
    })();
  </script>
</body>

</html>
