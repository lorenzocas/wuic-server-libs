<p-dialog
  [header]="(archetype === 'map' ? 'map.configure_header' : (archetype === 'carousel' ? 'carousel.configure_header' : (archetype === 'chart' ? 'chart.settings' : (archetype === 'kanban' ? 'Kanban settings' : 'archetype.configure')))) | translate"
  [(visible)]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [closable]="true"
  [style]="{ width: '760px', maxWidth: '95vw' }"
>
  @if (archetype === 'map') {
  <div class="archetype-config-grid">
    <label>{{ 'map.map_id' | translate }}</label>
    <input [(ngModel)]="mapDraft.mapId" />

    <label>{{ 'map.zoom' | translate }}</label>
    <input type="number" min="1" max="22" [(ngModel)]="mapDraft.zoom" />

    <label>{{ 'map.min_zoom' | translate }}</label>
    <input type="number" min="1" max="22" [(ngModel)]="mapDraft.minZoom" />

    <label>{{ 'map.max_zoom' | translate }}</label>
    <input type="number" min="1" max="22" [(ngModel)]="mapDraft.maxZoom" />

    <label>{{ 'map.center_lat' | translate }}</label>
    <input type="number" step="0.000001" [(ngModel)]="mapDraft.centerLat" />

    <label>{{ 'map.center_lng' | translate }}</label>
    <input type="number" step="0.000001" [(ngModel)]="mapDraft.centerLng" />

    <label>{{ 'map.use_current_location' | translate }}</label>
    <input type="checkbox" [(ngModel)]="mapDraft.useCurrentLocation" />

    <label>{{ 'map.use_clusterer' | translate }}</label>
    <input type="checkbox" [(ngModel)]="mapDraft.useClusterer" />

    <label>{{ 'map.filter_by_boundaries' | translate }}</label>
    <input type="checkbox" [(ngModel)]="mapDraft.filterByBoundaries" />

    <label>{{ 'map.title_field' | translate }}</label>
    <select [(ngModel)]="mapDraft.titleField">
      <option value=""></option>
      @for (col of fieldCandidates; track col.mc_nome_colonna) {
      <option [value]="col.mc_nome_colonna">{{ col.mc_display_string_in_view || col.mc_nome_colonna }}</option>
      }
    </select>

    <label>{{ 'map.info_field' | translate }}</label>
    <select [(ngModel)]="mapDraft.infoField">
      <option value=""></option>
      @for (col of fieldCandidates; track col.mc_nome_colonna) {
      <option [value]="col.mc_nome_colonna">{{ col.mc_display_string_in_view || col.mc_nome_colonna }}</option>
      }
    </select>

    <label>{{ 'map.marker_image_field' | translate }}</label>
    <select [(ngModel)]="mapDraft.customMarkerImageSrcField">
      <option value=""></option>
      @for (col of fieldCandidates; track col.mc_nome_colonna) {
      <option [value]="col.mc_nome_colonna">{{ col.mc_display_string_in_view || col.mc_nome_colonna }}</option>
      }
    </select>

    <label>{{ 'map.marker_image_src' | translate }}</label>
    <input [(ngModel)]="mapDraft.customMarkerImageSrc" />

    <label>{{ 'map.marker_content_callback' | translate }}</label>
    <textarea rows="3" [(ngModel)]="mapDraft.markerContentCallback"></textarea>

    <label>{{ 'map.info_function' | translate }}</label>
    <textarea rows="3" [(ngModel)]="mapDraft.infoFunction"></textarea>

    <label>{{ 'map.item_template_string' | translate }}</label>
    <textarea rows="4" [(ngModel)]="mapDraft.itemTemplateString"></textarea>
  </div>
  }

  @if (archetype === 'carousel') {
  <div class="archetype-config-grid">
    <label>{{ 'carousel.image_field' | translate }}</label>
    <select [(ngModel)]="carouselDraft.imageFieldName">
      <option value=""></option>
      @for (col of fieldCandidates; track col.mc_nome_colonna) {
      <option [value]="col.mc_nome_colonna">{{ col.mc_display_string_in_view || col.mc_nome_colonna }}</option>
      }
    </select>

    <label>{{ 'carousel.description_field' | translate }}</label>
    <select [(ngModel)]="carouselDraft.descriptionFieldName">
      <option value=""></option>
      @for (col of fieldCandidates; track col.mc_nome_colonna) {
      <option [value]="col.mc_nome_colonna">{{ col.mc_display_string_in_view || col.mc_nome_colonna }}</option>
      }
    </select>

    <label>{{ 'carousel.image_width' | translate }}</label>
    <input type="number" min="50" [(ngModel)]="carouselDraft.imageWidth" />

    <label>{{ 'page_size' | translate }}</label>
    <input type="number" min="1" [(ngModel)]="carouselDraft.pageSize" />

    <label>{{ 'carousel.visible_items' | translate }}</label>
    <input type="number" min="1" [(ngModel)]="carouselDraft.numVisible" />

    <label>{{ 'carousel.scroll_items' | translate }}</label>
    <input type="number" min="1" [(ngModel)]="carouselDraft.numScroll" />

    <label>{{ 'carousel.image_preview' | translate }}</label>
    <input type="checkbox" [(ngModel)]="carouselDraft.usePreview" />

    <label>{{ 'carousel.item_template' | translate }}</label>
    <textarea rows="4" [(ngModel)]="carouselDraft.itemTemplateString"></textarea>
  </div>
  }

  @if (archetype === 'chart') {
  <div class="archetype-config-grid">
    <label>{{ 'chart.type' | translate }}</label>
    <select [(ngModel)]="chartDraft.type">
      @for (type of chartTypes; track type) {
      <option [value]="type">{{ type }}</option>
      }
    </select>

    <label>{{ 'chart.legend' | translate }}</label>
    <div class="archetype-inline-row">
      <label><input type="checkbox" [(ngModel)]="chartDraft.legendDisplay" /> {{ 'chart.legend.show' | translate }}</label>
      <select [(ngModel)]="chartDraft.legendPosition">
        @for (p of legendPositions; track p) {
        <option [value]="p">{{ p }}</option>
        }
      </select>
    </div>

    <label>{{ 'title' | translate }}</label>
    <div class="archetype-inline-row">
      <label><input type="checkbox" [(ngModel)]="chartDraft.titleDisplay" /> {{ 'chart.title.show' | translate }}</label>
      <input type="text" [(ngModel)]="chartDraft.titleText" />
    </div>

    <label>{{ 'chart.general' | translate }}</label>
    <div class="archetype-inline-row">
      <label><input type="checkbox" [(ngModel)]="chartDraft.tooltipEnabled" /> {{ 'chart.tooltip' | translate }}</label>
      <label><input type="checkbox" [(ngModel)]="chartDraft.maintainAspectRatio" /> {{ 'chart.maintain_ratio' | translate }}</label>
    </div>

    <label>{{ 'chart.animation_ms' | translate }}</label>
    <div class="archetype-inline-row">
      <input type="number" min="0" [(ngModel)]="chartDraft.animationDuration" />
      <select [(ngModel)]="chartDraft.animationEasing">
        @for (e of animationEasings; track e) {
        <option [value]="e">{{ e }}</option>
        }
      </select>
    </div>

    <label>{{ 'chart.axes' | translate }}</label>
    <div class="archetype-inline-row">
      <label><input type="checkbox" [(ngModel)]="chartDraft.stacked" /> {{ 'chart.stacked' | translate }}</label>
      <label><input type="checkbox" [(ngModel)]="chartDraft.beginAtZero" /> {{ 'chart.y_begin_at_zero' | translate }}</label>
      <label><input type="checkbox" [(ngModel)]="chartDraft.showGridX" /> {{ 'chart.show_x_grid' | translate }}</label>
      <label><input type="checkbox" [(ngModel)]="chartDraft.showGridY" /> {{ 'chart.show_y_grid' | translate }}</label>
    </div>

    <label>{{ 'chart.index_axis' | translate }}</label>
    <select [(ngModel)]="chartDraft.indexAxis">
      <option value="x">x</option>
      <option value="y">y</option>
    </select>

    <label>{{ 'chart.cutout' | translate }}</label>
    <input type="number" min="0" max="95" [(ngModel)]="chartDraft.cutout" />

    <label>{{ 'chart.cutoff' | translate }}</label>
    <input type="number" min="0" [(ngModel)]="chartDraft.cutOffCount" />
  </div>
  }

  @if (archetype === 'kanban') {
  <div class="archetype-config-grid">
    <label>Status field</label>
    <select [(ngModel)]="kanbanDraft.statusField">
      <option value=""></option>
      @for (col of fieldCandidates; track col.mc_nome_colonna) {
      <option [value]="col.mc_nome_colonna">{{ col.mc_display_string_in_view || col.mc_nome_colonna }}</option>
      }
    </select>

    <label>Color field (lookup route)</label>
    <input [(ngModel)]="kanbanDraft.colorField" placeholder="es: ColorHex" />

    <label>WIP limit field (lookup route)</label>
    <input [(ngModel)]="kanbanDraft.wipLimitField" placeholder="es: WipLimit" />

    <label>WIP limit hard field (lookup route)</label>
    <input [(ngModel)]="kanbanDraft.wipLimitHardField" placeholder="es: WipLimitHard" />

    <label>Assigned user id field</label>
    <select [(ngModel)]="kanbanDraft.assignedUserIdField">
      <option value=""></option>
      @for (col of fieldCandidates; track col.mc_nome_colonna) {
      <option [value]="col.mc_nome_colonna">{{ col.mc_display_string_in_view || col.mc_nome_colonna }}</option>
      }
    </select>

    <label>Title field</label>
    <select [(ngModel)]="kanbanDraft.titleField">
      <option value=""></option>
      @for (col of fieldCandidates; track col.mc_nome_colonna) {
      <option [value]="col.mc_nome_colonna">{{ col.mc_display_string_in_view || col.mc_nome_colonna }}</option>
      }
    </select>

    <label>Description field</label>
    <select [(ngModel)]="kanbanDraft.descriptionField">
      <option value=""></option>
      @for (col of fieldCandidates; track col.mc_nome_colonna) {
      <option [value]="col.mc_nome_colonna">{{ col.mc_display_string_in_view || col.mc_nome_colonna }}</option>
      }
    </select>

    <label>Subtitle field</label>
    <select [(ngModel)]="kanbanDraft.cardSubtitleField">
      <option value=""></option>
      @for (col of fieldCandidates; track col.mc_nome_colonna) {
      <option [value]="col.mc_nome_colonna">{{ col.mc_display_string_in_view || col.mc_nome_colonna }}</option>
      }
    </select>

    <label>Card click action</label>
    <select [(ngModel)]="kanbanDraft.clickAction">
      <option value="detail">detail</option>
      <option value="edit">edit</option>
      <option value="none">none</option>
    </select>

    <label>Persist mode</label>
    <select [(ngModel)]="kanbanDraft.persistMode">
      <option value="immediate">immediate</option>
      <option value="batch">batch</option>
    </select>
  </div>

  <div class="archetype-section-title">Status columns</div>
  <div class="archetype-config-table">
    <div class="archetype-config-table-head">
      <span>Value</span>
      <span>Label</span>
      <span>Color</span>
      <span>Order</span>
      <span>WIP</span>
      <span>WIP hard</span>
      <span></span>
    </div>
    @for (row of (kanbanDraft.statusColumns || []); track row; let i = $index) {
    <div class="archetype-config-table-row">
      <input [(ngModel)]="row.value" />
      <input [(ngModel)]="row.label" />
      <input [(ngModel)]="row.color" placeholder="#3b82f6" />
      <input type="number" [(ngModel)]="row.order" />
      <input type="number" min="0" [(ngModel)]="row.wipLimit" />
      <input type="checkbox" [(ngModel)]="row.wipLimitHard" />
      <button class="p-element p-button p-component p-button-danger" type="button"
        (click)="removeKanbanStatusColumn(i)">remove</button>
    </div>
    }
    <div class="archetype-config-table-actions">
      <button class="p-element p-button p-component" type="button" (click)="addKanbanStatusColumn()">Add status
        column</button>
    </div>
  </div>
  }

  <ng-template pTemplate="footer">
    <p-button [label]="'cancel' | translate" severity="secondary" (onClick)="close()"></p-button>
    <p-button [label]="'apply' | translate" (onClick)="apply()"></p-button>
  </ng-template>
</p-dialog>
