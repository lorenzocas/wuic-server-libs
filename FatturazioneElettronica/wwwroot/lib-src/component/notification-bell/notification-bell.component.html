@if (isVisible) {
  <button type="button" class="notification-bell-btn" (click)="notificationPanel.toggle($event)"
    [attr.aria-label]="title || 'Notifiche'" [attr.title]="title || 'Notifiche'">
    <i class="pi pi-bell"></i>
    @if (unreadCount > 0) {
    <span class="notification-bell-badge">{{ unreadCount }}</span>
    }
  </button>

  <p-popover #notificationPanel appendTo="body" [style]="{ width: '26rem', maxWidth: '92vw' }">
    <div class="notification-panel">
      <div class="notification-panel-header-row">
        <div class="notification-panel-header">{{ title }}</div>
        @if (notifications.length) {
        <div class="notification-panel-actions">
          @if (unreadCount > 0) {
          <button type="button" class="notification-mark-all-btn" (click)="markAllRead()" [title]="markAllReadLabel">{{ markAllReadLabel }}</button>
          }
          <button type="button" class="notification-clear-read-btn" (click)="clearRead()">{{ clearReadLabel }}</button>
        </div>
        }
      </div>

      @if (!notifications.length) {
      <div class="notification-empty">{{ emptyMessage }}</div>
      }

      @for (n of notifications; track n.id) {
      <div class="notification-item"
           [class.notification-item-unread]="!n.isRead"
           [class.notification-item-clickable]="isClickable(n)">
        <button type="button" class="notification-item-open" (click)="openNotification(n)">
          <div class="notification-item-message">
            {{ n.message }}
            @if (isClickable(n)) {
            <i class="pi pi-angle-right notification-item-chevron" aria-hidden="true"></i>
            }
          </div>
          @if (getNotificationProgress(n) !== null) {
          <div class="notification-item-progress">
            <p-progressbar [value]="getNotificationProgress(n) || 0"></p-progressbar>
            <div class="notification-item-progress-text">{{ (getNotificationProgress(n) || 0).toFixed(2) }}%</div>
          </div>
          }
          <div class="notification-item-meta">{{ n.type }} · {{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}</div>
        </button>
        @if (n.isRead) {
        <button type="button" class="notification-item-delete" (click)="deleteReadNotification($event, n)" [title]="deleteNotificationTitle">
          <i class="pi pi-times"></i>
        </button>
        }
      </div>
      }
    </div>
  </p-popover>
}
