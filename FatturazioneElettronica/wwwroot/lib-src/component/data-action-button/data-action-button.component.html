@if (!simplified) {
<p-splitButton #btn appendTo="body" [model]="getActionMenuModel()" [disabled]="getActionMenuModel().length === 0"
  (onClick)="onClick($event)" (onMenuHide)="onMenuHide($event)" (onMenuShow)="onMenuShow($event)"
  (onDropdownClick)="onDropdownClick($event)" [buttonProps]="{ ariaLabel: ('actions' | translate) }"
  [menuButtonProps]="{ ariaLabel: ('actions' | translate) }" [expandAriaLabel]="'actions' | translate" />
}

@if (simplified) {
<div class="container-dropdown p-component p-button">
  <button type="button" class="p-button p-component p-button-sm p-button-text dropdown-trigger"
    [class.is-open]="simplifiedMenuOpen" (click)="onSimplifiedMenuClick($event)"
    [attr.aria-label]="'actions' | translate" [attr.aria-expanded]="simplifiedMenuOpen">
    <span class="p-button-icon pi pi-angle-down" [class.is-open]="simplifiedMenuOpen"></span>
  </button>
  <p-menu #simpleMenu [popup]="true" appendTo="body" [baseZIndex]="13000" [autoZIndex]="true"
    (onShow)="onSimplifiedMenuShow()" (onHide)="onSimplifiedMenuHide()" [model]="getActionMenuModel()"></p-menu>
</div>
}
