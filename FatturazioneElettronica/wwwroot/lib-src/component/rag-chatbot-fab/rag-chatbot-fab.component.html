@if (visible) {
  <!-- FAB bottom-right (position:fixed via .scss). z-index alto per stare sopra
       a navbar, dialog modali leggeri, ecc. ma sotto agli overlay critici (es.
       PrimeNG p-dialog modal stack). -->
  <button
    type="button"
    class="wuic-rag-fab"
    [class.wuic-rag-fab--dialog-open]="dialogVisible"
    [attr.title]="fabTooltip"
    aria-label="Apri chatbot codebase WUIC"
    (click)="toggleDialog()">
    <i class="pi pi-comments" aria-hidden="true"></i>
    @if (unreadRagCount > 0 && !dialogVisible) {
      <span class="wuic-rag-fab__badge" [attr.data-count]="unreadRagCount">
        {{ unreadRagCount > 9 ? '9+' : unreadRagCount }}
      </span>
    }
  </button>

  <!-- Dialog non-modal: l'utente puo' continuare a usare l'app sotto.
       contentStyle limita l'altezza interna al chatHeight + header.
       [draggable]="true" + [resizable]="true" per UX power-user.
       [appendTo]="'body'" sposta il dialog nel body document: evita che
       layout/scroll interactions con componenti heavy sottostanti (Syncfusion
       Spreadsheet con N-mila record, list-grid virtualized, ecc.) freezino la
       pagina quando il dialog apre/chiude. Il parent container NON subisce
       re-layout causato dalla presenza del dialog nel proprio subtree. -->
  <p-dialog
    [(visible)]="dialogVisible"
    [modal]="false"
    [draggable]="true"
    [resizable]="true"
    [closable]="true"
    [closeOnEscape]="true"
    [dismissableMask]="false"
    [appendTo]="'body'"
    [style]="{ width: dialogWidth }"
    [header]="dialogTitle"
    styleClass="wuic-rag-fab__dialog"
    (onHide)="onDialogHide()">
    <!-- Lazy-mount MANUALE del chatbot: PrimeNG p-dialog v17+ NON lazy-monta
         il content projettato (lo istanzia eagerly al creation del parent).
         Senza il guard `@if (dialogOpened)` il chatbot sarebbe istanziato al
         refresh → ngOnInit → `ragService.health()` → `GET /api/Rag/Health`
         anche se l'utente non apre mai il FAB (errore rosso in console se
         il RAG server Python e' offline, 503 Service Unavailable).
         `dialogOpened` e' sticky (setato dal primo `toggleDialog()`, mai
         resetto): una volta aperto, il chatbot resta montato e le
         ri-aperture sono istantanee (PrimeNG controlla solo la visibilita'
         DOM, niente rimonto ngOnInit). -->
    @if (dialogOpened) {
      <wuic-rag-chatbot
        [title]="dialogTitle"
        [chatHeight]="chatHeight"
        [showClearButton]="true">
      </wuic-rag-chatbot>
    }
  </p-dialog>
}
