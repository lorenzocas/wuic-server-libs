<p-menubar #metadataMenubar [model]="items" [styleClass]="'metadata-editor'" [autoDisplay]="false" appendTo="body" [autoZIndex]="true" [baseZIndex]="13000" [breakpoint]="'0px'">
    <ng-template #item let-item>
        <ng-container>
            <!-- Tag <button> (non <a>) per Lighthouse SEO `crawlable-anchors`:
                 questi sono action commands (es. "Insert column", "Remove
                 column", "Sync metadata from schema"), non navigation links
                 → semantica corretta. La classe `p-menubar-item-link` viene
                 mantenuta per uniformita' visiva con il resto del menubar
                 (vedi reset `appearance: none` etc. in metadata-editor.scss
                 sotto `button.p-menubar-item-link`). -->
            <button type="button" pRipple class="p-menubar-item-link" [class.p-disabled]="!!item?.disabled"
                style="display: flex; align-items: center; width: 100%;"
                (click)="onMenuItemClick($event, item)">
                <span class="p-menubar-item-label" style="padding-left: .5rem;">{{ item.label }}</span>
                @if (item?.item?.deletable || item?.deletable) {
                <span
                    style="margin-left: auto; color: #b3261e; font-weight: 700; cursor: pointer; padding: 0 .5rem; font-size: 1rem; line-height: 1;"
                    [title]="'delete' | translate" (click)="onMenuItemDeleteClick($event, item)">×</span>
                }
            </button>
        </ng-container>
    </ng-template>
</p-menubar>
