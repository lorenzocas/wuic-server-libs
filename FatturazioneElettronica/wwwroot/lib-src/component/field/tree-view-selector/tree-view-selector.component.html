@if (!field.mc_serverside_operations) {
  <p-tree [scrollHeight]="'100%'" [value]="nodes"
    (onNodeExpand)="onNodeExpand($event)" selectionMode="checkbox" [selection]="record[field.mc_nome_colonna] | async"
    (selectionChange)="modelChangeFn($event)">
    <ng-template let-node pTemplate="default">
      {{ node.object[field.mc_ui_lookup_dataTextField] }}
    </ng-template>
  </p-tree>
}
<!-- md_server_side_operations = true ? use repeater -->
