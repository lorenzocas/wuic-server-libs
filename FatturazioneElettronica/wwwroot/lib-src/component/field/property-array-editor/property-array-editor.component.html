<p-button icon="pi pi-plus" label="{{'add_grid' | translate}}" (onClick)="addObj()" />
@for (item of record[field.mc_nome_colonna] | async; track item; let i = $index) {
  <ul>
    @for (prop of nestedMetaInfo.columnMetadata; track prop) {
      <li>
        <wuic-field-editor [field]="prop" [record]="item" [metaInfo]="nestedMetaInfo" [nestedIndex]="i"
        [triggerProp]="triggerProp"></wuic-field-editor>
      </li>
    }
  </ul>
}
