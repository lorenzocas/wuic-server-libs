<div>
  <button class="btn btn-primary" (click)="toggleEditor()">Toggle Code
  Editor</button>
  @defer (when field.codeEditing) {
    <wuic-code-editor-lazy [record]="record" [field]="field" [metaInfo]="metaInfo"></wuic-code-editor-lazy>
  } @placeholder {
    <!-- CodeEditor (Monaco) lazy-loaded via @defer + LazyCodeEditorComponent:
         doppio livello di lazy per garantire che Monaco NON finisca nel chunk
         principale (vedi commento in code-area-editor.component.ts). -->
  } @loading (minimum 200ms) {
    <div class="code-editor-loading"><i class="pi pi-spin pi-spinner"></i> Caricamento editor…</div>
  }
  @if (!field.codeEditing) {
    <wuic-text-area-editor [record]="record" [field]="field" [metaInfo]="metaInfo"
      [tabIndex]="tabIndex"></wuic-text-area-editor>
  }
</div>
