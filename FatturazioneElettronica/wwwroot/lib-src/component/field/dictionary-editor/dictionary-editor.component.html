<p-select #selectCmp [options]="items" [ngModel]="record[field.mc_nome_colonna] | async" optionLabel="text" optionValue="value"
    [inputId]="field.ang_name" [name]="field.ang_name"
    [attr.aria-labelledby]="ariaLabelledBy"
    [tabindex]="resolvedTabIndex"
    [autoOptionFocus]="true"
    (keydown.enter)="onSelectKeyboardToggle($event)"
    (keydown.space)="onSelectKeyboardToggle($event)"
    (keydown.arrowdown)="onSelectKeyboardDown($event)"
    (keydown.arrowup)="onSelectKeyboardUp($event)"
    (onShow)="onSelectPanelShow()"
    (onHide)="onSelectPanelHide()"
    (onChange)="modelChangeFn($event)" (onBlur)="onBlur()" [disabled]="field.extras?.form?.disabled || readOnly"
    [ngClass]="field.extras?.style?.editCss" [panelStyleClass]="'wuic-dictionary-panel'" [scrollHeight]="'16rem'"
    [placeholder]="(lookupProps && lookupProps.placeholder) ? lookupProps.placeholder : ('dropdown_scegli' | translate)"
    appendTo="body" />
