<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Graph / social preview image, 1200x630 (the canonical 1.91:1 ratio
  used by Facebook, LinkedIn, WhatsApp, Slack, Discord). Referenced from
  src/index.html as `/assets/og-image.png` AND `/assets/og-image.svg`.

  Twitter Card (`summary_large_image`) wants a PNG/JPG — modern Facebook
  also prefers raster. The PNG companion is rendered by
  `scripts/render-brand-icons.mjs og-image.svg` (uses sharp at density=192,
  fixed to 1200x630 in the script). Run after editing this file.

  Layout:
    - top-left: faceted W mark (matches the favicon / navbar logo so social
      shares carry the same recognizable brand glyph)
    - centre-left wordmark + tagline + tech stack mention
    - bottom-left URL badge
    - top-right corner accent + bottom-right dot grid (decorative metadata
      pattern hint)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b132b"/>
      <stop offset="60%"  stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5bc0be"/>
      <stop offset="100%" stop-color="#6fffe9"/>
    </linearGradient>
    <!-- Facet shades for the W mark, lifted from wuic-icon-w-faceted.svg
         so the mark inside the og-image is byte-identical to the standalone
         favicon / navbar icon. -->
    <linearGradient id="lightFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#6fffe9"/>
      <stop offset="100%" stop-color="#5bc0be"/>
    </linearGradient>
    <linearGradient id="midFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5bc0be"/>
      <stop offset="100%" stop-color="#4aa39d"/>
    </linearGradient>
    <linearGradient id="darkFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4aa39d"/>
      <stop offset="100%" stop-color="#387c78"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid pattern (metadata hint) -->
  <g stroke="#5bc0be" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200"  y1="0" x2="200"  y2="630"/>
    <line x1="400"  y1="0" x2="400"  y2="630"/>
    <line x1="600"  y1="0" x2="600"  y2="630"/>
    <line x1="800"  y1="0" x2="800"  y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- decorative accent stroke (top-right corner) -->
  <path d="M 800 0 L 1200 0 L 1200 200 Z" fill="url(#accent)" opacity="0.08"/>

  <!--
    Faceted W mark, copied verbatim from wuic-icon-w-faceted.svg, then
    scaled (1.0625x = 272/256) so it stands at ~272px tall on the
    1200x630 canvas. Positioned in the top-left to read as the first
    element of the "[W mark] WUIC" lockup. We omit the rounded dark tile
    background because the og-image already provides the dark backdrop —
    keeping the tile here would create a darker box-in-box look.
  -->
  <g transform="translate(80, 80) scale(1.0625)">
    <polygon points="40,56 88,56 76,200" fill="url(#lightFace)"/>
    <polygon points="88,56 128,140 76,200" fill="url(#midFace)"/>
    <polygon points="88,56 168,56 128,140" fill="url(#darkFace)"/>
    <polygon points="168,56 180,200 128,140" fill="url(#midFace)"/>
    <polygon points="168,56 216,56 180,200" fill="url(#lightFace)"/>
    <g stroke="#6fffe9" stroke-width="1.6" fill="none" opacity="0.7">
      <polyline points="40,56 88,56"/>
      <polyline points="168,56 216,56"/>
    </g>
  </g>

  <!-- WUIC wordmark, shifted right to make room for the faceted mark.
       Mark spans x=(80+40*1.0625) .. (80+216*1.0625) ≈ 122 .. 309,
       so the wordmark starts at x=340 (30px breathing room from mark edge). -->
  <g transform="translate(340, 240)" filter="url(#glow)">
    <text x="0" y="0"
          font-family="Segoe UI, system-ui, -apple-system, sans-serif"
          font-weight="900" font-size="180"
          fill="#ffffff"
          letter-spacing="-6">WUIC</text>
  </g>

  <!-- Tagline -->
  <text x="80" y="380"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-weight="600" font-size="44"
        fill="url(#accent)"
        letter-spacing="-1">Metadata-Driven Business Applications</text>

  <!-- Subtitle: lista delle UI generate dai metadata.
       Coerente con la home hero — chatbot RAG NON e' generato da metadata,
       quindi qui non lo elenchiamo. -->
  <text x="80" y="440"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-weight="400" font-size="28"
        fill="#c5c6c7">CRUD &#183; Dashboards &#183; Workflows &#183; Reports</text>

  <!-- Tech-mention separata (stack + multi-platform + multi-dbms).
       Aggiornata vs versione precedente: ora include Linux nativo, in linea
       con il tile "Linux nativo" della home pubblicata 2026-05. -->
  <text x="80" y="485"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-weight="400" font-size="24"
        fill="#9aa5b1">.NET 10 &#160;&#183;&#160; Angular 21 &#160;&#183;&#160; Linux + Windows &#160;&#183;&#160; SQL Server + MySQL</text>

  <!-- Bottom badge bar -->
  <g transform="translate(80, 540)">
    <rect x="0" y="0" width="280" height="48" rx="8" fill="#5bc0be" fill-opacity="0.15" stroke="#5bc0be" stroke-opacity="0.4" stroke-width="1"/>
    <text x="20" y="32"
          font-family="Segoe UI, system-ui, -apple-system, sans-serif"
          font-weight="600" font-size="20"
          fill="#6fffe9">wuic-framework.com</text>
  </g>

  <!-- decorative dot grid (right side) -->
  <g fill="#5bc0be" fill-opacity="0.25">
    <circle cx="850"  cy="500" r="4"/>
    <circle cx="900"  cy="500" r="4"/>
    <circle cx="950"  cy="500" r="4"/>
    <circle cx="1000" cy="500" r="4"/>
    <circle cx="1050" cy="500" r="4"/>
    <circle cx="1100" cy="500" r="4"/>
    <circle cx="850"  cy="540" r="4"/>
    <circle cx="900"  cy="540" r="4"/>
    <circle cx="950"  cy="540" r="4"/>
    <circle cx="1000" cy="540" r="4"/>
    <circle cx="1050" cy="540" r="4"/>
    <circle cx="1100" cy="540" r="4"/>
    <circle cx="850"  cy="580" r="4"/>
    <circle cx="900"  cy="580" r="4"/>
    <circle cx="950"  cy="580" r="4"/>
    <circle cx="1000" cy="580" r="4"/>
    <circle cx="1050" cy="580" r="4"/>
    <circle cx="1100" cy="580" r="4"/>
  </g>
</svg>
